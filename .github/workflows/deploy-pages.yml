name: Публикация «Мой бюджет»
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Настройка Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Подготовка сайта
        run: |
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp icons/*.png _site/icons/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
