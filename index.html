<body>
  <main class="app">
    <header class="header"><div class="brand"><div class="logo">₽</div><div><h1>Мой бюджет</h1><p>Личные финансы</p></div></div><button class="icon-button" type="button" data-action="settings" aria-label="Открыть настройки">⚙</button></header>
    <div class="month-control"><button type="button" data-action="prev-month" aria-label="Предыдущий месяц">‹</button><strong id="monthLabel">Ноябрь 2026</strong><button type="button" data-action="next-month" aria-label="Следующий месяц">›</button></div>
    <section id="tab-home" class="tab-panel active" aria-label="Обзор"></section>
    <section id="tab-transactions" class="tab-panel" aria-label="Операции"></section>
    <section id="tab-budgets" class="tab-panel" aria-label="Лимиты"></section>
    <section id="tab-settings" class="tab-panel" aria-label="Настройки"></section>
  </main>
  <nav class="bottomnav" aria-label="Главная навигация"><button class="navitem active" data-tab="home"><span class="nav-icon">◫</span><span>Обзор</span></button><button class="navitem" data-tab="transactions"><span class="nav-icon">☷</span><span>Операции</span></button><button class="navitem" data-tab="budgets"><span class="nav-icon">◉</span><span>Лимиты</span></button><button class="navitem" data-tab="settings"><span class="nav-icon">⚙</span><span>Настройки</span></button></nav>
  <div id="modal" class="sheet-overlay" role="presentation"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetHeading"><div class="grabber"></div><div id="modalContent"></div></section></div>
  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="backupFile" accept="application/json,.json" class="hide">
  <script>
  (() => {
    'use strict';
    const KEY = 'moy_budget_v1';
    const DEFAULT_EXPENSE = [
      {id:'food',name:'Продукты',emoji:'🛒',color:'#92f0bf'},
      {id:'cafe',name:'Кафе',emoji:'☕',color:'#b49dff'},
      {id:'transport',name:'Транспорт',emoji:'🚙',color:'#85baff'},
      {id:'home',name:'Дом',emoji:'🏠',color:'#ffd39a'},
      {id:'family',name:'Семья',emoji:'👨‍👩‍👧',color:'#ffadc1'},
      {id:'shopping',name:'Покупки',emoji:'🛍️',color:'#b7e78c'},
      {id:'bills',name:'Платежи',emoji:'🧾',color:'#e4b5ff'},
      {id:'health',name:'Здоровье',emoji:'💊',color:'#82dfe7'},
      {id:'car',name:'Авто',emoji:'⛽',color:'#ffc07a'},
      {id:'fun',name:'Досуг',emoji:'🎮',color:'#bda9ff'},
      {id:'work',name:'Работа',emoji:'💼',color:'#8cbfe5'},
      {id:'other',name:'Другое',emoji:'📦',color:'#a8b5c9'}
    ];
    const DEFAULT_INCOME = [
      {id:'salary',name:'Зарплата',emoji:'💼',color:'#92f0bf'},
      {id:'sales',name:'Продажи',emoji:'💰',color:'#ffd39a'},
      {id:'side',name:'Подработка',emoji:'🛠️',color:'#85baff'},
      {id:'gift',name:'Подарки',emoji:'🎁',color:'#ffadc1'},
      {id:'refund',name:'Возврат',emoji:'↩️',color:'#b49dff'},
      {id:'other_income',name:'Другое',emoji:'✨',color:'#a8b5c9'}
    ];
    const today = () => {const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
    const initial = () => ({version:1,startBalance:0,transactions:[],expenses:structuredClone(DEFAULT_EXPENSE),incomes:structuredClone(DEFAULT_INCOME),limits:{},favorites:[]});
    let state = load(), selectedMonth=today().slice(0,7), tab='home', txFilter='all', searchText='', editTxId=null, modalMode='expense', modalCat='food', toastTimeout=null, undoData=null;
    const $ = sel => document.querySelector(sel);
    function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o && o.version===1 && Array.isArray(o.transactions)&&Array.isArray(o.expenses)&&Array.isArray(o.incomes)) return o;}catch{}return initial()}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{showToast('Память браузера недоступна. Экспортируйте данные.');return false}}
    const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = v => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(v)||0)+' ₽';
    const shortMoney = v => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(v)||0)+' ₽';
    const toNum = v => Number(String(v).replace(/\s/g,'').replace(',','.'));
    const getCats = type => type==='income'?state.incomes:state.expenses;
    const catOf = tx => getCats(tx.type).find(c=>c.id===tx.category)||{name:'Без категории',emoji:'📌',color:'#a8b5c9'};
    const monthTx = () => state.transactions.filter(x=>x.date.startsWith(selectedMonth));
    const amt = (xs,type) => xs.filter(x=>x.type===type).reduce((s,t)=>s+(Number(t.amount)||0),0);
    const periodData = () => {const t=monthTx();return {t,income:amt(t,'income'),expense:amt(t,'expense'),balance:state.startBalance+amt(state.transactions,'income')-amt(state.transactions,'expense')}};
    const uid = () => (globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2));
    const fmtDate = d => {const p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0]};
    const fmtMonth = m => {const [y,mm]=m.split('-').map(Number);const label=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(y,mm-1,1));return label[0].toUpperCase()+label.slice(1)};
    function showToast(message,withUndo=false){const box=$('#toast');box.innerHTML=esc(message)+(withUndo?'<button type="button" data-action="undo">Отменить</button>':'');box.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{box.classList.remove('show');undoData=null},4100)}
    function changeTab(next){tab=next;render();window.scrollTo({top:0,behavior:'smooth'})}
    function monthMove(diff){let [y,m]=selectedMonth.split('-').map(Number);let d=new Date(y,m-1+diff,1);selectedMonth=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0')].join('-');render()}
    function render(){
      $('#monthLabel').textContent=fmtMonth(selectedMonth);
      for(const t of ['home','transactions','budgets','settings']){$('#tab-'+t).classList.toggle('active',tab===t);document.querySelector(`[data-tab="${t}"]`).classList.toggle('active',tab===t)}
      renderHome();renderTransactions();renderBudgets();renderSettings();
      syncWidgetShortcuts();
    }
    function transactionRows(items,empty='Пока нет операций. Добавьте первую трату или доход.'){
      if(!items.length)return `<div class="empty-state"><span class="emoji">🧾</span>${esc(empty)}</div>`;
      return `<div class="transaction-list">${items.map(x=>{const c=catOf(x);const sign=x.type==='income'?'+':'−';return `<div class="tx"><div class="tx-emoji">${esc(c.emoji)}</div><div class="tx-main"><strong>${esc(x.note || c.name)}</strong><small>${esc(c.name)} · ${fmtDate(x.date)}</small></div><div class="tx-end"><div class="tx-amount ${x.type==='income'?'income':''}">${sign}${money(x.amount)}</div><button data-action="edit-tx" data-id="${esc(x.id)}" aria-label="Изменить операцию">Изменить</button></div></div>`}).join('')}</div>`;
    }
    function getBreakdown(){const data=monthTx().filter(x=>x.type==='expense');const by={};for(const x of data)by[x.category]=(by[x.category]||0)+Number(x.amount);return Object.entries(by).map(([id,value])=>({category:state.expenses.find(c=>c.id===id)||{id,name:'Другое',color:'#a8b5c9',emoji:'📦'},value})).sort((a,b)=>b.value-a.value)}
    function renderHome(){
      const {t,income,expense,balance}=periodData(),delta=income-expense;
      const favoriteMarkup=state.favorites.length?state.favorites.slice(0,8).map(f=>{const c=state.expenses.find(c=>c.id===f.category)||state.expenses[0];return `<button class="shortcut" data-action="quick-expense" data-id="${esc(f.id)}" title="Добавить расход"><div class="emoji">${esc(c.emoji)}</div><b>${esc(f.note||c.name)}</b><span>−${money(f.amount)} ↗</span></button>`}).join(''):'<div class="empty-shortcuts">⭐ Добавьте расход и отметьте «В быстрые расходы» — он появится здесь для записи в одно касание.</div>';
      const by=getBreakdown(),total=by.reduce((s,b)=>s+b.value,0);let position=0;
      const parts=by.map((b)=>{const a=position;position+=b.value/total*100;return `${b.category.color} ${a.toFixed(2)}% ${position.toFixed(2)}%`});
      const graph=by.length?`<div class="breakdown-top"><div class="donut" style="background:conic-gradient(${parts.join(',')})"><div class="donut-inner"><strong>${shortMoney(total)}</strong><small>расходы</small></div></div><div class="breakdown-side"><p>Наибольшая статья расходов</p><strong>${esc(by[0].category.emoji)} ${esc(by[0].category.name)}</strong><p style="margin-top:8px">${money(by[0].value)}</p></div></div><div class="category-bars">${by.slice(0,5).map(b=>`<div class="bar-row"><div class="bar-line"><span>${esc(b.category.emoji)} ${esc(b.category.name)}</span><span>${money(b.value)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,b.value/total*100)}%;background:${b.category.color}"></div></div></div>`).join('')}</div>`:'<div class="empty-state"><span class="emoji">📊</span>Когда добавите расходы, здесь появится разбивка по категориям.</div>';
      $('#tab-home').innerHTML=`<div class="hero"><div class="eyebrow">ОБЩИЙ БАЛАНС</div><div class="balance">${money(balance)}</div><div class="mutedrow"><span class="badge-change">${delta>=0?'+':'−'}${money(Math.abs(delta))}</span><span>за выбранный месяц</span></div></div><div class="stats"><div class="stat"><div class="stat-top"><div class="stat-icon">↙</div>Доходы</div><div class="stat-value">${shortMoney(income)}</div><div class="stat-caption">За ${esc(fmtMonth(selectedMonth).toLowerCase())}</div></div><div class="stat"><div class="stat-top"><div class="stat-icon out">↗</div>Расходы</div><div class="stat-value">${shortMoney(expense)}</div><div class="stat-caption">За ${esc(fmtMonth(selectedMonth).toLowerCase())}</div></div></div><div class="actions"><button class="primary-action" data-action="add-expense"><span class="action-sign">−</span> Добавить расход</button><button class="secondary-action" data-action="add-income"><span class="action-sign">+</span> Добавить доход</button></div><section class="section"><div class="section-heading"><h2>⚡ Быстрые расходы</h2></div><div class="shortcuts">${favoriteMarkup}</div></section><section class="section"><div class="section-heading"><h2>Куда уходят деньги</h2></div><div class="panel">${graph}</div></section><section class="section"><div class="section-heading"><h2>Последние операции</h2><button class="text-button" data-action="see-all">Все операции →</button></div><div class="panel">${transactionRows([...t].sort(sortTx).slice(0,5))}</div></section>`;
    }
    const sortTx=(a,b)=>(b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    function renderTransactions(){const arr=monthTx().filter(x=>(txFilter==='all'||x.type===txFilter)&&(!searchText||((x.note||'')+' '+catOf(x).name).toLowerCase().includes(searchText.toLowerCase()))).sort(sortTx);$('#tab-transactions').innerHTML=`<h2 class="subheading">Операции</h2><p class="subtext">Все доходы и расходы за ${esc(fmtMonth(selectedMonth).toLowerCase())}</p><div class="filter-row"><button class="filter ${txFilter==='all'?'active':''}" data-action="filter" data-filter="all">Все</button><button class="filter ${txFilter==='expense'?'active':''}" data-action="filter" data-filter="expense">Расходы</button><button class="filter ${txFilter==='income'?'active':''}" data-action="filter" data-filter="income">Доходы</button></div><input type="search" id="transactionSearch" class="search" placeholder="Поиск по категориям и заметкам" value="${esc(searchText)}" aria-label="Поиск операций"><div class="panel">${transactionRows(arr,'Операций по этому запросу не найдено.')}</div><div class="actions" style="margin-top:15px"><button class="primary-action" data-action="add-expense">− Расход</button><button class="secondary-action" data-action="add-income">+ Доход</button></div>`}
    function renderBudgets(){const data=periodData(),limits=state.limits||{},used=amt(data.t,'expense'),budgetTotal=Object.values(limits).reduce((s,v)=>s+(Number(v)||0),0);const rows=state.expenses.map(c=>{const spent=data.t.filter(x=>x.type==='expense'&&x.category===c.id).reduce((s,t)=>s+t.amount,0);const limit=Number(limits[c.id]||0);const ratio=limit>0?spent/limit:0;return `<div class="limit-item"><div class="limit-head"><span class="limit-cat">${esc(c.emoji)} ${esc(c.name)}</span><span class="limit-amount">${money(spent)} / ${limit>0?money(limit):'Без лимита'}</span></div><div class="limit-bar"><div class="limit-bar-fill ${ratio>1?'over':''}" style="width:${Math.max(0,Math.min(100,ratio*100))}%"></div></div><div class="limit-foot"><span>${limit>0?(spent>limit?'Превышение: '+money(spent-limit):'Осталось: '+money(limit-spent)):'Установите месячный лимит'}</span><button data-action="limit" data-category="${esc(c.id)}">${limit>0?'Изменить':'Установить'} →</button></div></div>`}).join('');$('#tab-budgets').innerHTML=`<h2 class="subheading">Лимиты расходов</h2><p class="subtext">Задайте месячные ограничения по категориям и контролируйте траты.</p><div class="stats"><div class="stat"><div class="stat-top">Сумма лимитов</div><div class="stat-value">${shortMoney(budgetTotal)}</div><div class="stat-caption">На каждый месяц</div></div><div class="stat"><div class="stat-top">Потрачено</div><div class="stat-value">${shortMoney(used)}</div><div class="stat-caption">За выбранный месяц</div></div></div><div class="limit-list">${rows}</div><p class="hint">Лимиты одинаковы для всех месяцев, а фактические траты рассчитываются отдельно для выбранного месяца. Категории без лимита в общий бюджет не входят.</p>`}
    function renderSettings(){ $('#tab-settings').innerHTML=`<h2 class="subheading">Настройки</h2><p class="subtext">Персональные данные и резервные копии</p><div class="setting-card"><p class="setting-title">💰 Начальный баланс</p><p class="setting-desc">Сколько денег было до начала учёта. Текущий остаток = начальный баланс + все доходы − все расходы.</p><div class="field-row"><div><label class="field-label" for="startBalance">Сумма, ₽</label><input id="startBalance" inputmode="decimal" class="field-input" type="text" value="${esc(state.startBalance)}"></div><button class="small-button" data-action="save-start">Сохранить</button></div></div><div class="setting-card"><p class="setting-title">📂 Мои данные</p><p class="setting-desc">Данные находятся только на этом устройстве в хранилище браузера. Сделайте резервную копию, чтобы не потерять историю.</p><div class="setting-buttons"><button class="outline-button" data-action="export-json">⬇️ Резервная копия</button><button class="outline-button" data-action="import-json">⬆️ Восстановить</button><button class="outline-button" data-action="export-csv">📄 Экспорт в CSV</button></div><div class="setting-notice">Важно: удаление данных сайта или очистка памяти браузера может стереть историю. Автоматической синхронизации с Google и банками пока нет.</div></div><div class="setting-card"><p class="setting-title">🏷️ Категории расходов</p><p class="setting-desc">Добавляйте собственные категории, например «Ремонт», «Золото» или «Долги».</p><div class="setting-buttons"><button class="outline-button" data-action="add-category">+ Новая категория</button></div></div><div class="setting-card"><p class="setting-title">🧹 Сброс данных</p><p class="setting-desc">Удалить все операции, лимиты и быстрые расходы на этом устройстве.</p><button class="danger-button" data-action="reset">Удалить всё</button></div><div class="hint">Мой бюджет v1.0 · офлайн-приложение · суммы в российских рублях</div>` }
    function openModal(html){$('#modalContent').innerHTML=html;$('#modal').classList.add('open');document.body.style.overflow='hidden'}
    function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow='';editTxId=null}
    function catChips(){return getCats(modalMode).map(c=>`<button class="cat-chip ${c.id===modalCat?'selected':''}" data-action="select-cat" data-id="${esc(c.id)}" type="button"><span>${esc(c.emoji)}</span><small>${esc(c.name)}</small></button>`).join('')}
    function openTransaction(type='expense',id=null){editTxId=id;const tx=id?state.transactions.find(t=>t.id===id):null;modalMode=tx?.type||type;modalCat=tx?.category||getCats(modalMode)[0]?.id;const val=tx?.amount||'',date=tx?.date||today();openModal(`<div class="sheet-title"><h2 id="sheetHeading">${tx?'Изменить операцию':'Новая операция'}</h2><button class="close" data-action="close" aria-label="Закрыть">×</button></div><div class="mode-switch"><button data-action="mode" data-type="expense" class="${modalMode==='expense'?'active':''}">− Расход</button><button data-action="mode" data-type="income" class="${modalMode==='income'?'active':''}">+ Доход</button></div><div class="amount-label">Сумма операции</div><div class="amount-wrap"><input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(val)}" aria-label="Сумма"><span class="currency">₽</span></div><label class="field-label">Категория</label><div id="catGrid" class="category-grid">${catChips()}</div><div class="twofields"><div><label class="field-label" for="txDate">Дата</label><input id="txDate" class="field-input" type="date" value="${esc(date)}"></div><div><label class="field-label" for="txNote">Комментарий</label><input id="txNote" class="field-input" type="text" maxlength="90" placeholder="Необязательно" value="${esc(tx?.note||'')}"></div></div><label class="checkboxline" id="favoriteLine" style="${modalMode==='income'?'display:none':''}"><input id="toFavorites" type="checkbox"> ⭐ Сохранить в быстрые расходы</label><button class="submit" data-action="save-tx">${tx?'Сохранить изменения':modalMode==='income'?'Добавить доход':'Добавить расход'}</button>${tx?'<div class="sheet-buttons"><button class="outline-button" data-action="close">Отмена</button><button class="danger-button" data-action="delete-tx">Удалить</button></div>':''}`);setTimeout(()=>$('#amount')?.focus({preventScroll:true}),80)}
    function switchType(type){if(type!==modalMode){modalMode=type;modalCat=getCats(type)[0]?.id}document.querySelectorAll('[data-action="mode"]').forEach(b=>b.classList.toggle('active',b.dataset.type===type));$('#catGrid').innerHTML=catChips();$('#favoriteLine').style.display=type==='income'?'none':'';$('[data-action="save-tx"]').textContent=editTxId?'Сохранить изменения':type==='income'?'Добавить доход':'Добавить расход'}
    function selectCat(id){modalCat=id;document.querySelectorAll('.cat-chip').forEach(b=>b.classList.toggle('selected',b.dataset.id===id))}
    function saveTx(){const amount=toNum($('#amount').value),date=$('#txDate').value,note=$('#txNote').value.trim();if(!Number.isFinite(amount)||amount<=0||amount>1e12){showToast('Введите сумму больше нуля');$('#amount').focus();return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){showToast('Укажите дату операции');return}if(!getCats(modalMode).some(c=>c.id===modalCat)){showToast('Выберите категорию');return}const old=editTxId?state.transactions.find(t=>t.id===editTxId):null;const entry={id:old?.id||uid(),type:modalMode,amount:Math.round(amount*100)/100,category:modalCat,note,date,createdAt:old?.createdAt||new Date().toISOString()};if(old){state.transactions=state.transactions.map(t=>t.id===entry.id?entry:t)}else{state.transactions.push(entry)}if(modalMode==='expense'&&$('#toFavorites')?.checked){const f={id:uid(),category:modalCat,amount:entry.amount,note};if(!state.favorites.some(p=>p.amount===f.amount&&p.category===f.category&&p.note===f.note))state.favorites.unshift(f)}save();selectedMonth=date.slice(0,7);closeModal();render();showToast(old?'Операция обновлена':'Операция добавлена ✓',!old);if(!old)undoData={type:'add',id:entry.id};}
    function quickExpense(id){const f=state.favorites.find(f=>f.id===id);if(!f)return;const entry={id:uid(),type:'expense',amount:f.amount,category:f.category,note:f.note,date:today(),createdAt:new Date().toISOString()};state.transactions.push(entry);selectedMonth=today().slice(0,7);save();render();undoData={type:'add',id:entry.id};showToast('Расход '+money(entry.amount)+' записан ✓',true)}
    function deleteTx(){const item=state.transactions.find(x=>x.id===editTxId);if(!item)return;if(!confirm('Удалить эту операцию?'))return;state.transactions=state.transactions.filter(x=>x.id!==editTxId);save();closeModal();render();showToast('Операция удалена')}
    function openLimit(category){const c=state.expenses.find(c=>c.id===category);if(!c)return;openModal(`<div class="sheet-title"><h2 id="sheetHeading">Лимит: ${esc(c.name)}</h2><button class="close" data-action="close">×</button></div><p class="setting-desc">Ограничение на каждый календарный месяц. Укажите 0, чтобы убрать лимит.</p><label class="field-label" for="limitValue">Лимит в месяц, ₽</label><input id="limitValue" class="field-input" type="text" inputmode="decimal" value="${esc(state.limits[category]||0)}"><button class="submit" data-action="save-limit" data-id="${esc(category)}" style="margin-top:17px">Сохранить лимит</button>`)}
    function saveLimit(id){const n=toNum($('#limitValue').value);if(!Number.isFinite(n)||n<0||n>1e12){showToast('Введите правильную сумму');return}state.limits[id]=Math.round(n*100)/100;save();closeModal();render();showToast('Лимит сохранён ✓')}
    function addCategory(){openModal(`<div class="sheet-title"><h2 id="sheetHeading">Новая категория</h2><button class="close" data-action="close">×</button></div><label class="field-label" for="newCatName">Название</label><input id="newCatName" class="field-input" type="text" maxlength="24" placeholder="Например, Ремонт"><label class="field-label" for="newCatEmoji">Значок (эмодзи)</label><input id="newCatEmoji" class="field-input" type="text" maxlength="8" value="📌"><button class="submit" data-action="save-cat" style="margin-top:18px">Добавить категорию</button>`)}
    function saveCategory(){const name=$('#newCatName').value.trim().slice(0,24),emoji=$('#newCatEmoji').value.trim().slice(0,8)||'📌';if(!name){showToast('Напишите название');return}if(state.expenses.length>=24){showToast('Максимум 24 категории');return}state.expenses.push({id:uid(),name,emoji,color:['#92f0bf','#85baff','#ffadc1','#ffd39a','#b49dff'][state.expenses.length%5]});save();closeModal();render();showToast('Категория создана ✓')}
    function download(name,text,kind){if(window.AndroidBridge&&typeof window.AndroidBridge.saveFile==='function'){window.AndroidBridge.saveFile(name,text,kind);return}const blob=new Blob([text],{type:kind}),href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),2000)}
    function exportJson(){download('moy-budget-backup-'+today()+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');showToast('Резервная копия сохранена')}
    const csvCell = x=>'"'+String(x??'').replace(/"/g,'""')+'"';
    function exportCsv(){let rows=[['Дата','Тип','Категория','Комментарий','Сумма (₽)']];state.transactions.slice().sort(sortTx).forEach(x=>rows.push([x.date,x.type==='income'?'Доход':'Расход',catOf(x).name,x.note,x.amount.toString().replace('.',',')]));download('moy-budget-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');showToast('CSV-файл готов')}
    async function importJson(file){if(!file)return;try{const raw=JSON.parse(await file.text());if(!raw||raw.version!==1||!Array.isArray(raw.transactions)||!Array.isArray(raw.expenses)||!Array.isArray(raw.incomes)||raw.transactions.length>100000)throw Error('Неизвестный формат');for(const t of raw.transactions){if(!t||!['income','expense'].includes(t.type)||!Number.isFinite(t.amount)||t.amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||typeof t.id!=='string'||typeof t.category!=='string')throw Error('Неверные операции')}if(!Number.isFinite(raw.startBalance)||!raw.limits||typeof raw.limits!=='object'||!Array.isArray(raw.favorites))throw Error('Неверная структура');if(!confirm('Заменить все текущие данные данными из резервной копии?'))return;state={version:1,startBalance:raw.startBalance,transactions:raw.transactions,expenses:raw.expenses,incomes:raw.incomes,limits:raw.limits,favorites:raw.favorites};save();render();showToast('Данные восстановлены ✓')}catch(e){showToast('Ошибка загрузки: '+(e?.message||'неверный файл'))}finally{$('#backupFile').value=''}}
    function reset(){if(!confirm('Точно удалить все операции и настройки? Это действие нельзя отменить без резервной копии.'))return;if(!confirm('Подтвердите полное удаление данных.'))return;state=initial();save();selectedMonth=today().slice(0,7);render();showToast('Данные удалены')}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-action], [data-tab]');if(!b)return;if(b.dataset.tab){changeTab(b.dataset.tab);return}const a=b.dataset.action;switch(a){case'settings':changeTab('settings');break;case'prev-month':monthMove(-1);break;case'next-month':monthMove(1);break;case'add-expense':openTransaction('expense');break;case'add-income':openTransaction('income');break;case'see-all':changeTab('transactions');break;case'filter':txFilter=b.dataset.filter;renderTransactions();break;case'close':closeModal();break;case'mode':switchType(b.dataset.type);break;case'select-cat':selectCat(b.dataset.id);break;case'save-tx':saveTx();break;case'edit-tx':openTransaction('expense',b.dataset.id);break;case'delete-tx':deleteTx();break;case'quick-expense':quickExpense(b.dataset.id);break;case'undo':if(undoData?.type==='add'){state.transactions=state.transactions.filter(x=>x.id!==undoData.id);save();render();undoData=null;$('#toast').classList.remove('show')}break;case'limit':openLimit(b.dataset.category);break;case'save-limit':saveLimit(b.dataset.id);break;case'save-start':{const n=toNum($('#startBalance').value);if(!Number.isFinite(n)||Math.abs(n)>1e12){showToast('Некорректная сумма');break}state.startBalance=Math.round(n*100)/100;save();render();showToast('Начальный баланс сохранён ✓');break}case'add-category':addCategory();break;case'save-cat':saveCategory();break;case'export-json':exportJson();break;case'export-csv':exportCsv();break;case'import-json':$('#backupFile').click();break;case'reset':reset();break;}});
    document.addEventListener('input',e=>{if(e.target.id==='transactionSearch'){const el=e.target;searchText=el.value;const pos=el.selectionStart;renderTransactions();const next=$('#transactionSearch');next.focus();try{next.setSelectionRange(pos,pos)}catch{}}});
    $('#backupFile').addEventListener('change',e=>importJson(e.target.files?.[0]));
    $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal();if(e.key==='Enter'&&$('#modal').classList.contains('open')&&e.target.id==='amount'){e.preventDefault();saveTx()}});
    // Native Android widget bridge. Uses the same WebView localStorage as the app.
    let widgetShortcutsSnapshot = '';
    function syncWidgetShortcuts(){
      if(!window.AndroidBridge || typeof window.AndroidBridge.syncWidget !== 'function')return;
      const favorites=state.favorites.slice(0,3).map(f=>({id:String(f.id),amount:Number(f.amount),note:String(f.note||''),category:String(f.category)}));
      const categories=state.expenses.map(c=>({id:String(c.id),name:String(c.name),emoji:String(c.emoji||'')}));
      const payload=JSON.stringify({favorites,categories});
      if(payload===widgetShortcutsSnapshot)return;
      try{window.AndroidBridge.syncWidget(payload);widgetShortcutsSnapshot=payload;}catch(e){console.warn('Widget sync failed',e)}
    }
    window.MoyBudgetWidget = Object.freeze({
      handle:function(action,arg){
        if(action==='favorite'){
          if(!state.favorites.some(f=>f.id===arg)){showToast('Быстрый расход изменён. Откройте приложение.');syncWidgetShortcuts();return false;}
          quickExpense(arg);return true;
        }
        if(action==='amount'){
          const value=Number(arg);
          openTransaction('expense');
          if(Number.isFinite(value)&&value>0&&value<=1e12)$('#amount').value=String(value);
          return true;
        }
        openTransaction('expense');return true;
      }
    });
    if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
    render();
  })();
  </script>
